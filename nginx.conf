# Static game at the root. HTML/CSS/JS have no hashed names, so they always
# revalidate (the hub learned the hard way what stale caches do); sprites and
# environment art cache a week.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location = /healthz { add_header Content-Type text/plain; return 200 'ok'; }

  location ^~ /assets/ { add_header Cache-Control "public, max-age=604800"; }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
